name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild (vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check tag matches app version
        run: |
          for file in frontend/src-tauri/tauri.conf.json frontend/package.json; do
            version=$(grep -m1 -o '"version": *"[^"]*"' "$file" | cut -d'"' -f4)
            [ "v$version" = "$TAG" ] || { echo "$file has $version, tag is $TAG"; exit 1; }
          done
          cargo_version=$(grep -m1 '^version' frontend/src-tauri/Cargo.toml | cut -d'"' -f2)
          [ "v$cargo_version" = "$TAG" ] || { echo "Cargo.toml has $cargo_version, tag is $TAG"; exit 1; }
      - name: Write release notes
        run: |
          highlights=$(awk -v heading="### $TAG" '$0 == heading {found=1; next} found && /^##/ {exit} found' README.md)
          [ -n "$(echo "$highlights" | tr -d '[:space:]')" ] || { echo "README What's new has no ### $TAG block"; exit 1; }
          {
            echo "## Highlights"
            echo "$highlights"
            echo
            echo "## Platforms"
            echo
            echo "- macOS Apple Silicon: \`meetily-macos-arm64.dmg\`"
            echo "- Linux x86_64 (Debian/Ubuntu): \`meetily-linux-x86_64.deb\`"
            echo "- Linux x86_64 (Fedora/RHEL/openSUSE): \`meetily-linux-x86_64.rpm\`"
            echo
            echo "## Install"
            echo
            echo "macOS: open the .dmg, drag Meetily Pro to Applications, then run once:"
            echo
            echo '```sh'
            echo "xattr -dr com.apple.quarantine \"/Applications/Meetily Pro.app\""
            echo '```'
            echo
            echo "The app is ad-hoc signed, not notarized; this clears the download quarantine so macOS lets it open."
            echo
            echo "Linux: \`sudo apt install ./meetily-linux-x86_64.deb\` or \`sudo dnf install ./meetily-linux-x86_64.rpm\`"
            echo
            echo "Already on 1.10.1 or later: open About, Check for Updates, then Update and Restart."
            echo
            echo "Verify downloads against \`SHA256SUMS\`: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`"
            echo
            echo "## Quickstart"
            echo
            echo "1. Launch Meetily Pro and download the Whisper \`base\` model when asked."
            echo "2. Press record; the transcript appears live."
            echo "3. The assistant next to the transcript suggests what to ask and answers your questions."
            echo
            echo "Full changelog: https://github.com/${{ github.repository }}/commits/${TAG}"
          } > notes.md
          cat notes.md
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --notes-file notes.md
          else
            gh release create "$TAG" --draft --verify-tag --title "Meetily Pro $TAG" --notes-file notes.md
          fi

  build:
    name: Build ${{ matrix.asset }}
    needs: draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
            helper-features: --features metal
            bundles: app
            asset: meetily-macos-arm64
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            helper-features: ''
            bundles: deb,rpm
            asset: meetily-linux-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev clang cmake rpm
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.triple }}
      - name: Build llama-helper sidecar
        run: |
          cargo build --release --locked -p llama-helper ${{ matrix.helper-features }}
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-${{ matrix.triple }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build app
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Smoke test packaged app
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
            codesign --verify --deep --strict "$app"
            for bin in meetily llama-helper ffmpeg; do test -x "$app/Contents/MacOS/$bin"; done
          else
            deb=$(find target/release/bundle/deb -name '*.deb' | head -1)
            contents=$(dpkg-deb --contents "$deb")
            for bin in meetily llama-helper; do echo "$contents" | grep -q "usr/bin/$bin$"; done
            if echo "$contents" | grep -q "usr/bin/ffmpeg$"; then echo "package bundles ffmpeg"; exit 1; fi
            dpkg-deb -f "$deb" Depends | grep -q ffmpeg
            rpm=$(find target/release/bundle/rpm -name '*.rpm' | head -1)
            contents=$(rpm -qlp "$rpm")
            for bin in meetily llama-helper; do echo "$contents" | grep -q "usr/bin/$bin$"; done
            if echo "$contents" | grep -q "usr/bin/ffmpeg$"; then echo "package bundles ffmpeg"; exit 1; fi
            rpm -qp --requires "$rpm" | grep -q "^/usr/bin/ffmpeg"
          fi
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = macOS ]; then
            frontend/src-tauri/dmg/build-dmg.sh "$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)" "dist/${{ matrix.asset }}.dmg"
            update=$(find target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' | head -1)
            cp "$update" "dist/${{ matrix.asset }}.app.tar.gz"
            cp "$update.sig" "dist/${{ matrix.asset }}.app.tar.gz.sig"
          else
            for ext in deb rpm; do
              package=$(find target/release/bundle/$ext -name "*.$ext" | head -1)
              cp "$package" "dist/${{ matrix.asset }}.$ext"
              cp "$package.sig" "dist/${{ matrix.asset }}.$ext.sig"
            done
          fi
          gh release upload "$TAG" dist/* --clobber

  publish:
    name: Verify and publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checksum, verify assets, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir assets
          gh release download "$TAG" --dir assets --pattern 'meetily-*'
          for expected in meetily-macos-arm64.dmg meetily-macos-arm64.app.tar.gz meetily-macos-arm64.app.tar.gz.sig meetily-linux-x86_64.deb meetily-linux-x86_64.deb.sig meetily-linux-x86_64.rpm meetily-linux-x86_64.rpm.sig; do
            test -s "assets/$expected" || { echo "missing $expected"; exit 1; }
          done
          (cd assets && sha256sum meetily-* > SHA256SUMS && cat SHA256SUMS)
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          jq -n --arg version "${TAG#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg base "$base" --rawfile mac assets/meetily-macos-arm64.app.tar.gz.sig --rawfile deb assets/meetily-linux-x86_64.deb.sig --rawfile rpm assets/meetily-linux-x86_64.rpm.sig '{version: $version, pub_date: $date, platforms: {"darwin-aarch64": {url: "\($base)/meetily-macos-arm64.app.tar.gz", signature: ($mac | gsub("\\s"; ""))}, "linux-x86_64-deb": {url: "\($base)/meetily-linux-x86_64.deb", signature: ($deb | gsub("\\s"; ""))}, "linux-x86_64-rpm": {url: "\($base)/meetily-linux-x86_64.rpm", signature: ($rpm | gsub("\\s"; ""))}}}' > assets/latest.json
          cat assets/latest.json
          gh release upload "$TAG" assets/SHA256SUMS assets/latest.json --clobber
          current=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo v0.0.0)
          newest=$(printf '%s\n%s\n' "$current" "$TAG" | sort -V | tail -1)
          if [ "$newest" = "$TAG" ]; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false --latest=false
          fi
